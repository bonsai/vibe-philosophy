name: Agent admission gate

on:
  workflow_dispatch:
    inputs:
      boundary_results_path:
        description: Path to the boundary test results CSV
        required: true
        default: tests/agent-boundary-results.csv
        type: string
      six_axis_results_path:
        description: Path to the six-axis results CSV
        required: true
        default: tests/agent-six-axis-results.csv
        type: string

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Evaluate behavioral boundary gate
        run: python scripts/agent_admission_gate.py "${{ inputs.boundary_results_path }}"
      - name: Evaluate six-axis gate
        run: python scripts/agent_six_axis_gate.py "${{ inputs.six_axis_results_path }}"
